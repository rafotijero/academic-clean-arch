# application-dev.yml - Configuración para desarrollo
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/academic_enrollment}
    username: ${DB_USERNAME:academic_user}
    password: ${DB_PASSWORD:academic_pass}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: false

logging:
  level:
    com.academic.enrollment: DEBUG
    org.springframework.web: DEBUG
    org.springframework.data: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

academic:
  enrollment:
    notification:
      email:
        enabled: false  # Deshabilitar emails en desarrollo
      sms:
        enabled: false  # Deshabilitar SMS en desarrollo
